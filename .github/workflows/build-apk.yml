name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # 仅在推送 v 开头的 tag 时触发 Release 工作流

permissions:
  contents: write # 必须赋予写权限，否则无法自动创建 Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. 给予 gradlew 执行权限
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. 执行 APK 打包命令
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. (可选) 查找并重命名/确认生成的 APK 路径
      # 通常路径在 app/build/outputs/apk/release/app-release.apk

      # 6. 自动创建 Release 并上传 APK
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          # 自动上传的文件路径，支持通配符
          files: app/build/outputs/apk/release/*.apk
          # Release 标题（默认使用 Tag 名称）
          name: Release ${{ github.ref_name }}
          # 自动将 Git Commit 日志作为 Release 说明文案
          generate_release_notes: true
          # 是否设置为预发布/草稿（默认 false）
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
