name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0 的 Tag 时自动触发发布流程

permissions:
  contents: write # 声明写入权限，允许 Actions 创建 Release 并上传文件

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 配置 JDK 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. 执行打包命令生成 Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. 自动创建 Release 并上传新名字的 APK
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          # 使用通配符匹配打包输出目录下的所有 .apk 文件
          # 这样无论你的 APK 改成什么名字（如 AssetStudio_v1.10.2_release.apk）都能自动抓取并上传
          files: app/build/outputs/apk/release/*.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
